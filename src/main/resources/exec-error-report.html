<!DOCTYPE HTML>
<html xmlns:x="http://www.jenitennison.com/xslt/xspec">
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
            <title>Test Report for @title@</title>
            <link rel="stylesheet" href="@css.href@"></link>
    </head>
    <body id="testReport">
        <h1>Test Report</h1>
        <div id="errors">
            <h2 class="errors">Execution was aborted!</h2>
            <p>You will find the XSpec log below.</p>
            <p><b>Important:</b> You may also need to look at the Maven build log for more details.</p>
            <table class="xspecResult">
                <thead>
                    <tr>
                        <th>XSpec log messages</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>
                            <pre><code style="white-space: pre-line;">@error.message@</code></pre>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </body>
</html>
